<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linked List Cycle Detection</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Cycle Detection Visualizer</h1>

    <div class="container">
        <h2>Floyd's Tortoise and Hare Algorithm</h2>
        
        <div id="cycle-list" class="list"></div>

        <div class="controls">
            <button onclick="startCycleVisualization()">Detect Cycle!</button>
        </div>

        <p id="statusText">Press the button to start the race...</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
